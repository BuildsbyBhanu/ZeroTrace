[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zerotrace"
version = "0.1.0"
description = "Automated Web Application Security Assessment Platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "ZeroTrace Team" }
]
keywords = ["security", "scanner", "owasp", "vulnerability", "penetration-testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "websockets>=13.0",

    # HTTP client
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",

    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",

    # CLI
    "typer>=0.12.0",
    "click>=8.1.0",

    # Pydantic
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # Templates & Reporting
    "jinja2>=3.1.4",
    "pymupdf>=1.24.0",
    "pillow>=10.4.0",

    # Security
    "cryptography>=43.0.0",
    "python-dotenv>=1.0.1",

    # Utilities
    "rich>=13.7.1",
    "tqdm>=4.66.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "factory-boy>=3.3.0",
    "httpx>=0.27.0",
    "coverage>=7.6.0",
]
nuclei = [
    # Optional: Nuclei integration (download binary separately)
]
postgres = [
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.9",
]

[project.scripts]
zerotrace = "cli.main:app"
zerotrace-server = "zerotrace.main:create_app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]  # Handled by line-length

[tool.ruff.lint.isort]
known-first-party = ["zerotrace", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
strict = true
exclude = ["tests/"]

[tool.coverage.run]
source = ["src/zerotrace", "cli"]
omit = ["**/tests/**", "**/migrations/**"]
