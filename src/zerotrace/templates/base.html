<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ title }} — ZeroTrace{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        critical: '#dc2626',
                        high: '#ea580c',
                        medium: '#ca8a04',
                        low: '#2563eb',
                        informational: '#6b7280',
                    }
                }
            }
        }
    </script>
    <style>
        [data-theme='dark'] .critical { @apply text-critical; }
        [data-theme='dark'] .high { @apply text-red-600; }
        [data-theme='dark'] .medium { @apply text-yellow-600; }
        [data-theme='dark'] .low { @apply text-blue-600; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100">
    <nav class="bg-slate-100 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-bold text-slate-900 dark:text-slate-100 hover:text-red-600">
                        ZeroTrace
                    </a>
                </div>
                <div class="hidden md:flex md:space-x-8">
                    <a href="/" class="text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-slate-100 px-3 py-2 rounded-md text-sm font-medium">Home</a>
                    <a href="/#new-scan" class="text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-slate-100 px-3 py-2 rounded-md text-sm font-medium">New Scan</a>
                    <a href="/history" class="text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-slate-100 px-3 py-2 rounded-md text-sm font-medium">History</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-slate-100 dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 mt-16">
        <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8 text-center text-slate-600 dark:text-slate-400">
            <p>ZeroTrace v{{ version or '0.1.0' }} • Web Application Security Assessment Platform</p>
        </div>
    </footer>
</body>
</html>
